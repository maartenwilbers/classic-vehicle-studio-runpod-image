name: Publish RunPod image

on:
  push:
    branches:
      - main
    paths:
      - runpod/Dockerfile
      - runpod/requirements.lock
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          tags: |
            ghcr.io/maartenwilbers/classic-vehicle-studio-runpod:2.0.3
            ghcr.io/maartenwilbers/classic-vehicle-studio-runpod:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            CVS_COMMIT=${{ github.sha }}
            RUNPOD_STACK_VERSION=2.0.3
